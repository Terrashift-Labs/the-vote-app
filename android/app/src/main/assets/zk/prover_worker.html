<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script src="snarkjs.min.js"></script>
<script>
/**
 * ZK Prover Worker — runs inside a hidden WebView.
 *
 * Receives a JSON message via Android.postMessage(json) and responds
 * via window.ProverCallback.onProofReady(json) / .onProofError(msg).
 *
 * Message format (input):
 *   { type: "prove", inputs: { nullifier, secret, merkleRoot, merklePath, policyId } }
 *
 * Response format:
 *   { proof: { pi_a, pi_b, pi_c }, publicSignals }
 */
window.receiveMessage = async function(json) {
  try {
    const msg = JSON.parse(json);
    if (msg.type !== 'prove') return;

    const { inputs } = msg;

    // Fetch circuit artifacts from app assets (served via asset:// scheme)
    const [wasmResp, zkeyResp] = await Promise.all([
      fetch('vote_eligibility.wasm'),
      fetch('vote_eligibility_final.zkey')
    ]);
    const wasmBuffer = await wasmResp.arrayBuffer();
    const zkeyBuffer = await zkeyResp.arrayBuffer();

    const { proof, publicSignals } = await snarkjs.groth16.fullProve(
      inputs,
      new Uint8Array(wasmBuffer),
      new Uint8Array(zkeyBuffer)
    );

    window.ProverCallback.onProofReady(JSON.stringify({ proof, publicSignals }));
  } catch (e) {
    window.ProverCallback.onProofError(e.message || String(e));
  }
};
</script>
</body>
</html>

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: thevoteapp-backend
    static_configs:
      - targets: ["backend:3000"]
    metrics_path: /metrics

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

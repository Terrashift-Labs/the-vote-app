name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ── Android ──────────────────────────────────────────────────────────────────
  android-release:
    name: Android — Build & Upload to Play Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Write Google Play key
        run: echo '${{ secrets.GOOGLE_PLAY_JSON_KEY }}' > gp-key.json

      - name: Build & upload AAB
        run: fastlane android release
        env:
          ANDROID_KEYSTORE_PATH:     keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_JSON_KEY_PATH: gp-key.json

  # ── iOS ──────────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS — Build & Upload to TestFlight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo '${{ secrets.ASC_API_KEY_JSON }}' > asc-api-key.json

      - name: Build & upload IPA
        run: fastlane ios release
        env:
          MATCH_GIT_URL:                ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD:               ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_PATH: asc-api-key.json
          APPLE_ID:                     ${{ secrets.APPLE_ID }}
          ITC_TEAM_ID:                  ${{ secrets.ITC_TEAM_ID }}
          APPLE_TEAM_ID:                ${{ secrets.APPLE_TEAM_ID }}

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend-release:
    name: Backend — Deploy to production
    runs-on: ubuntu-latest
    needs: [android-release, ios-release]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Build TypeScript
        run: cd backend && npm run build

      - name: Deploy
        run: cd backend && npm run deploy:prod
        env:
          NODE_ENV:              production
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
          RPC_URL:               ${{ secrets.RPC_URL }}
          CONTRACT_ADDRESS:      ${{ secrets.CONTRACT_ADDRESS }}
          JWT_SECRET:            ${{ secrets.JWT_SECRET }}
          RP_ID:                 ${{ secrets.RP_ID }}
          ORIGIN:                ${{ secrets.ORIGIN }}
